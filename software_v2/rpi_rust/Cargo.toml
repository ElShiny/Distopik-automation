[package]
name = "rpi_rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio-modbus = { version = "*", default-features = false, features = ["rtu-sync"] }
tokio-serial = "5.4.1"
tokio = { version = "1", features = ["full"] }
serialport = "4.3.0"
rppal = "0.18.0"
